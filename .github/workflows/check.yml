name: Check student exercises

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync the locked CPU environment and student package
        run: uv sync --locked
      - name: Check syntax and setup
        run: |
          uv run --locked python -m compileall -q src exercises tools
          uv run --locked python tools/check_setup.py
      - name: Exercise every CLI mode
        run: uv run --locked python tools/smoke_check.py
      - name: Run Week 2 notebook and numerical checks
        run: uv run --locked python tools/check_week02.py
      - name: Run Week 3 notebook and numerical checks
        run: uv run --locked python tools/check_week03.py
